<aside class="sidebar">

  <!-- Repo info -->
  <div class="repo-info">
    <div class="repo-name" [title]="repoName()">{{ repoName() }}</div>
    <div class="repo-meta">
      <span class="branch-indicator">
        <app-icon name="git-branch" />
        {{ branch() }}
      </span>
      @if (unpushed() > 0) {
        <span class="unpushed-count">{{ unpushed() }} ahead</span>
      }
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    @for (item of nav; track item.route) {
      <a class="nav-item"
         [routerLink]="item.route"
         routerLinkActive="nav-item--active">
        <span class="nav-icon"><app-icon [name]="item.icon" /></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-spacer"></div>

  <!-- Secondary nav -->
  <nav class="sidebar-nav sidebar-nav--secondary">
    @for (item of secondary; track item.route) {
      <a class="nav-item"
         [routerLink]="item.route"
         routerLinkActive="nav-item--active">
        <span class="nav-icon"><app-icon [name]="item.icon" /></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }

    <button class="nav-item nav-item--close" (click)="closeRepo()" title="Close repository">
      <span class="nav-icon"><app-icon name="close" /></span>
      <span class="nav-label">Close Repo</span>
    </button>
  </nav>

</aside>
